<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Mundo Cartas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="fondo-patron">
    
    <div class="contenedor-tarjeta">
        <div class="tarjeta-acceso">
            
            <div class="encabezado-logo">
                <img src="img/logo.png" alt="Logo Mundo Cartas" class="logo">
            </div>

            <h2>Bienvenido a Mundo Cartas</h2>

            <form action="#" method="POST" class="formulario">
                <div class="grupo-input">
                    <input type="text" placeholder="Correo electrónico o nombre de usuario" required>
                </div>
                <div class="grupo-input">
                    <input type="password" placeholder="Contraseña" required>
                </div>

                <a href="#" class="enlace-olvido">¿Tienes problemas para iniciar sesión?</a>

                <button type="submit" class="btn-principal">Iniciar sesión</button>
            </form>

            <!--  <div class="separador">
                <span>o inicia sesión con</span>
            </div> --> 

            <div class="seccion-registro">
                <p>¿No tienes una cuenta?</p>
                <a href="#" class="btn-secundario">Crea una cuenta</a>
            </div>

            <div class="pie-tarjeta">
                <p>&copy; 2026 Mundo Cartas Arica.</p>
            </div>

        </div>
    </div>

</body>
</html>
